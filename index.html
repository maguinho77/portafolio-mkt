<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4.magos - Portafolio</title>

    <!-- Vinculación del archivo CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tipografía Outfit desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Librería de animaciones AOS (Animate On Scroll) -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>

<body>

    <!-- TARJETA PRINCIPAL -->
    <main class="card" data-aos="fade-up" data-aos-duration="850">

        <!-- 1. Menú de Navegación Superior -->
        <header data-aos="fade-down" data-aos-delay="100">
            <nav class="nav-menu">
                <a href="index.html" class="nav-link active">Inicio</a>
                <a href="proyectos.html" class="nav-link">Proyectos</a>
                <a href="contacto.html" class="nav-link">Contacto</a>
            </nav>
        </header>

        <!-- 2. Avatar / Foto de Perfil -->
        <div class="avatar-container" data-aos="zoom-in" data-aos-delay="200" data-aos-duration="800">
            <img src="img/avatar.jpg" alt="Foto de perfil de Lucas Caballeria" class="avatar-img">
        </div>

        <!-- 3. Información Personal -->
        <h1 class="profile-name" data-aos="fade-up" data-aos-delay="300">Lucas Caballeria</h1>
        <p class="profile-title" data-aos="fade-up" data-aos-delay="350">Ingeniero en Marketing · Diplomado en joseo · Titulado en generar dinero</p>

        <!-- Línea decorativa y distintivo de marca -->
        <div class="divider" data-aos="fade-up" data-aos-delay="400"></div>
        <span class="profile-tag" data-aos="zoom-in" data-aos-delay="450">@4.magos</span>

        <!-- 4. Biografía -->
        <p class="profile-bio" data-aos="fade-up" data-aos-delay="500">
            Me apasiona el marketing digital, el desarrollo de marcas y el comercio deportivo.
        </p>

        <!-- 5. Botones de Redes Sociales / Contacto -->
        <section class="social-links">
            <a href="https://www.instagram.com/p/Dclc0QiOh9T/" target="_blank" class="social-btn" data-aos="fade-up" data-aos-delay="550">
                <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                </svg>
                <span>Instagram</span>
            </a>

            <a href="https://linkedin.com" target="_blank" class="social-btn" data-aos="fade-up" data-aos-delay="650">
                <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>
                    <rect x="2" y="9" width="4" height="12"></rect>
                    <circle cx="4" cy="4" r="2"></circle>
                </svg>
                <span>LinkedIn</span>
            </a>

            <a href="https://whatsapp.com" target="_blank" class="social-btn" data-aos="fade-up" data-aos-delay="750">
                <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                    </path>
                </svg>
                <span>WhatsApp</span>
            </a>
        </section>

        <!-- 6. Pie de página semántico -->
        <footer class="site-footer" data-aos="fade-up" data-aos-delay="800">
            <p>© 2026 4.magos · Todos los derechos reservados</p>
        </footer>

    </main>

    <!-- Scripts de la librería AOS -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true
        });
    </script>
</body>

</html>
