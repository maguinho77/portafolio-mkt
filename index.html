<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Vinculación del archivo CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tipografía Outfit desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- TARJETA PRINCIPAL -->
    <main class="card">

        <!-- 1. Menú de Navegación Superior -->
        <nav class="nav-menu">
            <a href="index.html" class="nav-link active">Inicio</a>

            <a href="contacto.html" class="nav-link">Contacto</a>
        </nav>

        <!-- 2. Avatar / Foto de Perfil -->
        <div class="avatar-container">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80"
                alt="Foto de Lucas Caballeria" class="avatar-img">
        </div>

        <!-- 3. Información Personal -->
        <h1 class="profile-name">Lucas Caballerias</h1>
        <p class="profile-title">Ingeniero en Marketing, generando dinero</p>

        <!-- Línea decorativa -->
        <div class="divider"></div>

        <!-- 4. Biografía -->
        <p class="profile-bio">
            Me apasiona el dinero.

        <!-- 5. Botones de Redes Sociales / Contacto -->
        <div class="social-links">
            <a href="https://instagram.com" target="_blank" class="social-btn">
                <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>

                </svg>

            <a href="https://linkedin.com" target="_blank" class="social-btn">

                    <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path>

            <a href="https://whatsapp.com" target="_blank" class="social-btn">
                <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
