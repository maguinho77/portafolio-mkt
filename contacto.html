<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - 4.magos</title>

    <!-- Vinculación del archivo CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Tipografía Outfit desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- TARJETA PRINCIPAL (CONTACTO) -->
    <main class="card card-large">

        <!-- 1. Menú de Navegación Superior -->
        <header>
            <nav class="nav-menu">
                <a href="index.html" class="nav-link">Inicio</a>
                <a href="proyectos.html" class="nav-link">Proyectos</a>
                <a href="contacto.html" class="nav-link active">Contacto</a>
            </nav>

            <!-- 2. Encabezado de la Sección -->
            <div class="section-header">
                <h1 class="section-title">Contacto</h1>
                <div class="title-bar"></div>
                <p class="section-subtitle">¿Tienes consultas sobre nuestras camisetas o pedidos especiales? ¡Escríbenos y te responderemos a la brevedad!</p>
            </div>
        </header>

        <!-- 3. Contenedor de Formulario e Información -->
        <section class="contact-container">
            <!-- Formulario -->
            <form class="contact-form" onsubmit="event.preventDefault(); alert('¡Mensaje enviado con éxito! Te responderemos pronto.');">
                <div class="form-group">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="Tu nombre completo" required>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="message" class="form-label">Mensaje</label>
                    <textarea id="message" name="message" class="form-textarea" rows="4" placeholder="¿Qué camiseta o producto te interesa consultar?" required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    Enviar mensaje
                </button>
            </form>

            <!-- Tarjeta Lateral de Información -->
            <aside class="contact-info-card">
                <div class="info-icon-wrapper">
                    <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
                <div class="info-content">
                    <p class="info-label">También puedes escribirnos a</p>
                    <a href="mailto:contacto@4magos.cl" class="info-email">contacto@4magos.cl</a>
                    <p class="info-subtext">Responderemos en menos de 24 horas.</p>
                </div>
            </aside>
        </section>

        <!-- 4. Pie de página semántico -->
        <footer class="site-footer">
            <p>© 2026 4.magos · Todos los derechos reservados</p>
        </footer>

    </main>

</body>

</html>
